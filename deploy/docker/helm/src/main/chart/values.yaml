baseUrl: 
storageClassName:
clusterIssuer: letsencrypt
version: maven-fixes-9.1-SNAPSHOT

# memory limit for php
memoryLimit: 1024M
resources:
  limits:
    cpu: "1000m"
    memory: "2Gi"
  requests:
    cpu: "500m"
    memory: "2Gi"
database:
  storageSize: 30Gi
  resources:
    limits:
      cpu: "1000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "2Gi"
  enabled: true
  # when enabled = false for external database
  config:
    host: "???"
    port: "???"
    database: "???"
    username: "???"
    password: "???"
  podSecurityContext:
    fsGroup: 1001
  securityContext:
    runAsUser: 1001

onlyofficeDocumentServer:
# enable the save button in only office
onlyofficeForceSaveEnabled: false
onlyofficePluginUrl:
onlyOfficePlugins: true

onlyofficeEdusharingPlugin:
  enabled: false
  label:
  url:

global:
  image:
    pullSecret:
    registry: docker.edu-sharing.com
    pullPolicy: Always
image:
  custom:
    postgresql: community/common/edu_sharing-community-common-docker-postgresql:13.15.0

podSecurityContext:

  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:

  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsUser: 1000

ingress:
  annotations:
