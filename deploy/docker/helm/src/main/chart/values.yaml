baseUrl: 
storageClassName:
clusterIssuer: letsencrypt
version: maven-fixes-9.1-SNAPSHOT
database:
  storageSize: 30Gi
  enabled: true
  # when enabled = false for external database
  config:
    host: "???"
    port: "???"
    database: "???"
    username: "???"
    password: "???"
  podSecurityContext:
    fsGroup: 1001
