apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edu-sharing-connector
spec:
  selector:
    matchLabels:
      app: edu-sharing-connector
  replicas: 1
  serviceName: edu-sharing-connector
  template:
    metadata:
      labels:
        app: edu-sharing-connector
    spec:
     {{- if .Values.global.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.image.pullSecret }}
     {{- end }}
     {{- with .Values.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
     {{- end }}
      containers:
      - name: edu-sharing-connector
        image: {{ .Values.global.image.registry }}/community/edu_sharing-community-services-edu-connector-service:{{ .Values.version }}
        {{- with .Values.securityContext }}
        securityContext: {{ toYaml . | nindent 10 }}
        {{- end }}
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        env:
        - name: CACHE_CLUSTER
          value: {{ .Values.config.cache.cluster | quote }}
        - name: CACHE_DATABASE
          value: {{ .Values.config.cache.database | quote }}
        - name: CACHE_HOST
          value: {{ .Values.config.cache.host | quote }}
        - name: CACHE_PORT
          value: {{ .Values.config.cache.port | quote }}
        - name: HOST_EXTERNAL
          value: {{ if .Values.absoluteUrl }}{{ .Values.absoluteUrl }}{{else}}"connector.services.{{ .Values.baseUrl }}"{{ end }}
        - name: PROT_EXTERNAL
          value: "https"
        - name: PORT_EXTERNAL
          value: "443"
        - name: DATABASE_HOST
          value: {{ if .Values.database.enabled }}"edu-sharing-connector-db"{{ else }}{{ .Values.database.config.host }}{{ end }}
        - name: DATABASE_PORT
          value: {{ if .Values.database.enabled }}"3306"{{ else }}"{{ .Values.database.config.port }}"{{ end }}
        - name: DATABASE_USER
          value: {{ if .Values.database.enabled }}"connector"{{ else }}{{ .Values.database.config.username }}{{ end }}
        - name: DATABASE_NAME
          value: {{ if .Values.database.enabled }}"connector"{{ else }}{{ .Values.database.config.database }}{{ end }}
        - name: DATABASE_PASSWORD
          value: {{ if .Values.database.enabled }}{{required "A valid .Values.passwordDB is required!" .Values.passwordDB}}{{ else }}{{ .Values.database.config.password }}{{ end }}
        - name: ONLYOFFICE_DOCUMENT_SERVER
          value: {{ .Values.onlyofficeDocumentServer}}
        - name: ONLYOFFICE_FORCE_SAVE_ENABLED
          value: "{{ .Values.onlyofficeForceSaveEnabled }}"
        - name: ONLYOFFICE_PLUGIN_URL
          value: {{ .Values.onlyofficePluginUrl }}
        - name: ONLYOFFICE_PLUGINS
          value: "{{ .Values.onlyOfficePlugins }}"
        - name: ONLYOFFICE_EDUSHARING_PLUGIN
          value: "{{ .Values.onlyofficeEdusharingPlugin.enabled }}"
        - name: ONLYOFFICE_EDUSHARING_PLUGIN_LABEL
          value: {{ .Values.onlyofficeEdusharingPlugin.label }}
        - name: ONLYOFFICE_EDUSHARING_PLUGIN_ICON
          value: {{ .Values.onlyofficeEdusharingPlugin.icon }}
        - name: ONLYOFFICE_JWT_SECRET
          value: {{ .Values.onlyofficeJwtSecret | default "" }}
        - name: MOODLE_BASE_DIR
          value: {{ .Values.moodleBaseDir | default "" }}
        - name: MOODLE_TOKEN
          value: {{ .Values.moodleToken | default "" }}
        - name: UPLOAD_FILE_SIZE
          value: {{ .Values.uploadFileSize | default "512M" }}
        - name: POST_MAX_SIZE
          value: {{ .Values.postMaxSize | default "513M" }}
        - name: MEMORY_LIMIT
          value: {{ .Values.memoryLimit | default "1024M" }}
        livenessProbe:
          httpGet:
            path: /metadata
            port: api
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /metadata
            port: api
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        {{- with .Values.resources }}
        resources: {{ toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: 80
          name: api
        volumeMounts:
        - name: data
          mountPath: /var/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: edu-sharing-services-connector-data

---
{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: edu-sharing-connector-db
spec:
  selector:
    matchLabels:
      app: edu-sharing-connector-db
  replicas: 1
  serviceName: edu-sharing-connector-db
  template:
    metadata:
      labels:
        app: edu-sharing-connector-db
    spec:
      {{- if .Values.global.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.image.pullSecret }}
      {{- end }}
      {{- with merge .Values.database.podSecurityContext .Values.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: edu-sharing-connector-db
        image: {{ .Values.image.custom.postgresql }}
        {{- with merge .Values.database.securityContext .Values.securityContext }}
        securityContext: {{ toYaml . | nindent 10 }}
        {{- end }}
        env:
        - name: POSTGRESQL_DATABASE
          value: connector
        - name: POSTGRESQL_USERNAME
          value: connector
        - name: POSTGRESQL_PASSWORD
          value: {{ .Values.passwordDB }}
        - name: POSTGRESQL_POSTGRES_PASSWORD
          value: {{ .Values.passwordDB }}
        resources:
          limits:
            cpu: "2000m"
            memory: "2Gi"
          requests:
            cpu: "1000m"
            memory: "2Gi"
        ports:
          - name: db
            containerPort: 5432
        volumeMounts:
          - name: data
            mountPath: /bitnami/postgresql

  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      storageClassName: {{ .Values.storageClassName }}
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: "16Gi"
{{ end }}
